imports:
  - adi_lg_plugins

targets:
  main:
    features:
      - zcu102
      - admv1455
    # List form (not a dict) because PyVISADevice / PyVISADriver appear twice.
    resources:
      - CyberPowerOutlet:
          address: 10.68.152.115
          outlet: 1
          delay: 5.0
      - RawSerialPort:
          port: /dev/ttyUSB0
          speed: 115200
      - USBSDMuxDevice:
          name: sdmux
      - MassStorageDevice:
          path: /dev/disk/by-id/usb-LinuxAut_sdFST_HS-SD_MMC_00048.00589-0:0
          use_with_sdmux: true
      - KuiperRelease:
          release_version: 2023_R2_P1
          cache_path: /tmp/kuiper_cache
          kernel_path: /home/adi/Desktop/zcu102_admv_test_v4/zcu102_admv_test_v4/Image
          BOOTBIN_path: /home/adi/Desktop/zcu102_admv_test_v4/zcu102_admv_test_v4/BOOT.BIN
          device_tree_path: /home/adi/Desktop/zcu102_admv_test_v4/zcu102_admv_test_v4/system.dtb
      # RF bench: spectrum analyzer on the output (R&S FSU67) and signal generator
      # on the input (R&S SMA100B). "@py" selects the pyvisa-py backend (no NI-VISA).
      - PyVISADevice:
          name: spectrum_analyzer_visa
          type: TCPIP0
          url: 10.10.100.10::inst0
          backend: "@py"
      - PyVISADevice:
          name: signal_generator_visa
          type: TCPIP0
          url: 10.10.100.15::inst0
          backend: "@py"
    drivers:
      - CyberPowerDriver: {}
      - USBSDMuxDriver: {}
      - USBStorageDriver:
          bindings:
            storage: sdmux
      - SerialDriver: {}
      - ADIShellDriver:
          prompt: 'root@.*'
          login_prompt: 'analog login: '
          username: root
          password: analog
      - KuiperDLDriver: {}
      - MassStorageDriver:
          partition: /dev/disk/by-id/usb-LinuxAut_sdFST_HS-SD_MMC_00048.00589-0:0-part1
      - PyVISADriver:
          name: spectrum_analyzer_session
          bindings:
            pyvisa_resource: spectrum_analyzer_visa
      - PyVISADriver:
          name: signal_generator_session
          bindings:
            pyvisa_resource: signal_generator_visa
      - PyInstSpectrumAnalyzerDriver:
          name: spectrum_analyzer
          instrument: FSU67
          bindings:
            visa: spectrum_analyzer_session
      - PyInstSignalGeneratorDriver:
          name: signal_generator
          instrument: SMA100B
          bindings:
            visa: signal_generator_session
